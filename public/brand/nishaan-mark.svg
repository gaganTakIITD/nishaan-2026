  <text x="32" y="30" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="0.5">N</text>
  <text x="32" y="47" text-anchor="middle" fill="#F7E7C8" font-family="system-ui, sans-serif" font-size="5.5" font-weight="600" letter-spacing="1.8">NISHAAN</text>
